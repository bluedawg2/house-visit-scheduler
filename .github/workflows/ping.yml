name: Ping App
on:
  schedule:
    # Every 30 minutes — well within the 24-hour inactivity sleep window.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Cache the Chromium binary (~300 MB) so most runs skip the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright
        run: pip install playwright

      # Full install (browser + OS deps) on cache miss.
      - name: Install Chromium + deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # On cache hit the browser binary is restored, but OS packages still need installing.
      - name: Install Chromium OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Wake Streamlit app
        run: python scripts/wake_app.py
